# tmux setup for every player's session (root-owned, read-only, see shell.sh).
# tmux keeps the player's shell and programs running while the browser tab is
# closed; the next login reattaches the same session.
set -g default-command "/bin/bash --rcfile /etc/toolbox/bashrc -i"
set -g default-terminal "tmux-256color"
set -g history-limit 20000
set -g mouse on                       # wheel scrolls; Shift + drag copies in the browser
set -g status-style "bg=colour24,fg=white"
set -g status-left " #(echo $PSEUDO) "
set -g status-left-length 30
set -g status-right " Ctrl-b c : nouvel onglet · Ctrl-b n : suivant "
set -g status-right-length 60
set -g update-environment ""
