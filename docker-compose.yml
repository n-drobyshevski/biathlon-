# ============================================================================
#  DÉCAFLOP CTF — live web / SAP challenges
#  Target host: Raspberry Pi 5 (4 GB) behind a travel router, no internet.
#  All images build natively on arm64. Each service is memory-capped so the
#  whole set fits comfortably in 4 GB alongside the scoreboard.
#
#  Flags are injected from .env (see ./scripts/gen-flags.sh) — nothing secret
#  lives in this file or in git.
#
#  Ports: "${BIND_ADDR:-}${BIND_ADDR:+:}8080:5000" renders as "8080:5000" when
#  BIND_ADDR is unset (the offline default: every interface, IPv4 + IPv6,
#  exactly as before) and as "127.0.0.1:8080:5000" with BIND_ADDR=127.0.0.1
#  (loopback only). Comments are not interpolated. Optional online hosting
#  through a Cloudflare Tunnel is a separate overlay; see CLOUDFLARE.md:
#    docker compose -f docker-compose.yml -f docker-compose.cloudflare.yml up -d
# ============================================================================

services:
  # ---- Players' entry point (not a challenge) ----------------------------
  # http://<PiIP>:8080 — the "cellule de crise": briefs the team, lists every
  # mission, links the live ones and serves the handout files.
  hub:
    build: ./hub
    environment:
      CTFD_PORT: "8000"                       # links to the CTFd scoreboard on the same host
      SCOREBOARD_URL: "${SCOREBOARD_URL:-}"   # optional override, e.g. http://192.168.8.2:8000
      CYBERCHEF_PORT: "8090"                  # browser toolbox (CyberChef), linked from the Outils tab
      TERMINAL_PORT: "8091"                   # browser terminal (ttyd), linked from the Outils tab
      CYBERCHEF_URL: "${CYBERCHEF_URL:-}"     # optional override if hosted elsewhere
      TERMINAL_URL: "${TERMINAL_URL:-}"       # optional override if hosted elsewhere
      GUIDE_PASSWORD: "${GUIDE_PASSWORD:-debutant}"  # unlocks the optional "Mode guidé" walkthrough
    volumes:
      - ./handouts/dist:/handouts:ro          # built by ./scripts/build-handouts.sh
    ports: ["${BIND_ADDR:-}${BIND_ADDR:+:}8080:5000"]
    mem_limit: 96m
    restart: unless-stopped

  # ---- 01 · Web · easy ---------------------------------------------------
  # Also publishes the sponsor's official poster (02) and a race photo (03) in
  # its press area / actualités: handouts/dist is mounted read-only and served
  # byte-for-byte at /medias/<name>.
  staff:
    build: ./challenges/01-web-staff
    environment:
      FLAG: "${FLAG_01_STAFF}"
      HANDOUT_DIR: /handouts
      # Shown on the staff portal so solving 01 reveals the share login.
      # SAME values as the share service below (one source feeds both).
      SHARE_USER: "${SHARE_USER:-equipe-it}"
      SHARE_PASSWORD: "${SHARE_PASSWORD:-transition2026}"
    volumes:
      - ./handouts/dist:/handouts:ro          # built by ./scripts/build-handouts.sh
    ports: ["${BIND_ADDR:-}${BIND_ADDR:+:}8001:5000"]
    mem_limit: 128m
    restart: unless-stopped

  # ---- Internal file share (Partage DFlop) ------------------------------
  # http://<PiIP>:8020 — DécaFlop's internal document share. Not a challenge:
  # the crew logs in and browses folders to find the evidence files, served
  # byte-for-byte from the same handouts/dist. The cellule de crise hands out
  # the login (see the Contexte sheet).
  share:
    build: ./share
    environment:
      SHARE_USER: "${SHARE_USER:-equipe-it}"
      SHARE_PASSWORD: "${SHARE_PASSWORD:-transition2026}"
    volumes:
      - ./handouts/dist:/handouts:ro          # built by ./scripts/build-handouts.sh
    ports: ["${BIND_ADDR:-}${BIND_ADDR:+:}8020:5000"]
    mem_limit: 96m
    restart: unless-stopped

  # ---- 04 · Web · medium (IDOR) -----------------------------------------
  idor:
    build: ./challenges/04-web-idor
    environment:
      FLAG: "${FLAG_04_IDOR}"
    ports: ["${BIND_ADDR:-}${BIND_ADDR:+:}8004:5000"]
    mem_limit: 128m
    restart: unless-stopped

  # ---- 06 · Web · medium (SQLi auth bypass) -----------------------------
  sqli:
    build: ./challenges/06-web-sqli
    environment:
      FLAG: "${FLAG_06_SQLI}"
    ports: ["${BIND_ADDR:-}${BIND_ADDR:+:}8006:5000"]
    mem_limit: 128m
    restart: unless-stopped

  # ---- 10 · Web · hard (JWT weak secret) --------------------------------
  # JWT_SECRET is the HS256 signing secret players crack. The SAME value is
  # leaked in 11's git history (see gitleak below), so dumping that repo is an
  # alternate route into this challenge. Both default to 10's own default.
  jwt:
    build: ./challenges/10-web-jwt
    environment:
      FLAG: "${FLAG_10_JWT}"
      JWT_SECRET: "${JWT_SECRET:-DecaFlop2026}"
    ports: ["${BIND_ADDR:-}${BIND_ADDR:+:}8010:5000"]
    mem_limit: 128m
    restart: unless-stopped

  # ---- 11 · Web · hard (exposed .git) -----------------------------------
  # API_JWT_SECRET must match 10's JWT_SECRET: the entrypoint writes it into the
  # first commit's config, so the git leak also exposes 10's signing secret.
  gitleak:
    build: ./challenges/11-web-gitleak
    environment:
      FLAG: "${FLAG_11_GIT}"
      API_JWT_SECRET: "${JWT_SECRET:-DecaFlop2026}"
    ports: ["${BIND_ADDR:-}${BIND_ADDR:+:}8011:5000"]
    mem_limit: 128m
    restart: unless-stopped

  # ---- 12 · Web · hard (SSTI) -------------------------------------------
  ssti:
    build: ./challenges/12-web-ssti
    environment:
      FLAG: "${FLAG_12_SSTI}"
    ports: ["${BIND_ADDR:-}${BIND_ADDR:+:}8012:5000"]
    mem_limit: 128m
    restart: unless-stopped

  # ---- 14 · SAP · medium (gateway reginfo, simulated) -------------------
  sapgw:
    build: ./challenges/14-sap-gateway
    environment:
      FLAG: "${FLAG_14_SAP_GW}"
    ports: ["${BIND_ADDR:-}${BIND_ADDR:+:}8014:5000"]
    mem_limit: 128m
    restart: unless-stopped

  # ---- Scoreboard: CTFd (teams, flags, hints, scores) --------------------
  # http://<PiIP>:8000 — finish the setup wizard once, then load the
  # challenges with: python3 scripts/ctfd-setup.py --host <PiIP>
  ctfd:
    image: ctfd/ctfd:3.8.8
    environment:
      SECRET_KEY: "${CTFD_SECRET_KEY}"          # from .env (gen-flags.sh)
      DATABASE_URL: "sqlite:////var/uploads/ctfd.db"
      UPLOAD_FOLDER: /var/uploads
      WORKERS: "1"
    volumes:
      - ctfd-data:/var/uploads                   # database + uploads; `down -v` wipes it
    ports: ["${BIND_ADDR:-}${BIND_ADDR:+:}8000:8000"]
    mem_limit: 768m
    restart: unless-stopped

  # ---- Browser toolbox for locked-down (corporate) laptops --------------
  # Players install nothing: a browser reaches both of these on the Pi.
  # http://<PiIP>:8090 — CyberChef (static, 100% client-side: base64, EXIF,
  #   unzip, file carving, MD5, JWT). Stateless, one shared instance is fine.
  #   Needs tools/cyberchef/cyberchef.zip at build time (see its README).
  cyberchef:
    build: ./tools/cyberchef
    ports: ["${BIND_ADDR:-}${BIND_ADDR:+:}8090:80"]
    mem_limit: 96m
    restart: unless-stopped

  # http://<PiIP>:8091 — ttyd web terminal with git-dumper, john, binwalk,
  #   foremost, exiftool, curl, python3. The catch-all (really only 11 needs a
  #   shell). Non-root, NO repo/flags/source mounted, each connection gets its
  #   own scratch workspace; capped so one player can't starve the Pi.
  toolbox:
    build: ./tools/toolbox
    ports: ["${BIND_ADDR:-}${BIND_ADDR:+:}8091:7681"]
    mem_limit: 512m
    cpus: 2.0
    pids_limit: 256
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped

volumes:
  ctfd-data:
