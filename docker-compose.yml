# ============================================================================
#  DÉCAFLOP CTF — live web / SAP challenges
#  Target host: Raspberry Pi 5 (4 GB) behind a travel router, no internet.
#  All images build natively on arm64. Each service is memory-capped so the
#  whole set fits comfortably in 4 GB alongside the scoreboard.
#
#  Flags are injected from .env (see ./scripts/gen-flags.sh) — nothing secret
#  lives in this file or in git.
#
#  Ports: "${BIND_ADDR:-}${BIND_ADDR:+:}8080:5000" renders as "8080:5000" when
#  BIND_ADDR is unset (the offline default: every interface, IPv4 + IPv6,
#  exactly as before) and as "127.0.0.1:8080:5000" with BIND_ADDR=127.0.0.1
#  (loopback only). Comments are not interpolated. Optional online hosting
#  through a Cloudflare Tunnel is a separate overlay; see CLOUDFLARE.md:
#    docker compose -f docker-compose.yml -f docker-compose.cloudflare.yml up -d
# ============================================================================

# ---- Player isolation -------------------------------------------------------
# Every team shares ONE instance of each service, so nothing a player does may
# stick for the others. The Flask apps (hub, share and the challenges) run as
# nobody with no capabilities and a read-only image: even a popped app (12 is
# code execution by design) cannot rewrite its code or files, and a restart
# always brings it back pristine. Scratch space is a small tmpfs. pids/cpu caps
# keep a fork bomb or busy loop from starving the Pi; `init` reaps orphans so
# they never pile up against the pids cap.
x-locked-app: &locked-app
  user: "65534:65534"
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  read_only: true
  tmpfs: ["/tmp:size=32m,mode=1777"]
  init: true
  # pids/cpu caps: in each service's deploy.resources.limits (compose refuses
  # pids_limit/cpus next to a deploy.resources block)

services:
  # ---- Players' entry point (not a challenge) ----------------------------
  # http://<PiIP>:8080 — the "cellule de crise": briefs the team, lists every
  # mission, links the live ones and serves the handout files.
  hub:
    <<: *locked-app
    build: ./hub
    environment:
      CTFD_PORT: "8000"                       # links to the CTFd scoreboard on the same host
      SCOREBOARD_URL: "${SCOREBOARD_URL:-}"   # optional override, e.g. http://192.168.8.2:8000
      CYBERCHEF_PORT: "8090"                  # browser toolbox (CyberChef), linked from the Outils tab
      TERMINAL_PORT: "8091"                   # browser terminal (ttyd), linked from the Outils tab
      CYBERCHEF_URL: "${CYBERCHEF_URL:-}"     # optional override if hosted elsewhere
      TERMINAL_URL: "${TERMINAL_URL:-}"       # optional override if hosted elsewhere
      GUIDE_PASSWORD: "${GUIDE_PASSWORD:-debutant}"  # unlocks the optional "Mode guidé" walkthrough
      NOTES_DB: /data/notes.db                # accounts, mission statuses, Bloc-notes (hub-data volume)
      CTFD_INTERNAL_URL: "${CTFD_INTERNAL_URL:-http://ctfd:8000}"  # sign in with the scoreboard account; "" = hub's own pseudos
      HUB_LOGIN: "${HUB_LOGIN:-1}"            # 1 = sign in before any sheet (statuses per player); 0 = open hub
      NOTES_SHARED: "${NOTES_SHARED:-1}"      # 0 = private notepads only, no shared ones
    volumes:
      - ./handouts/dist:/handouts:ro          # built by ./scripts/build-handouts.sh
      - hub-data:/data                        # Bloc-notes; wipe: docker compose exec hub python notes_admin.py vider --oui
    ports: ["${BIND_ADDR:-}${BIND_ADDR:+:}8080:5000"]
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
          pids: 128
    restart: unless-stopped

  # ---- 01 · Web · easy ---------------------------------------------------
  # Also publishes the sponsor's official poster (02) and a race photo (03) in
  # its press area / actualités: handouts/dist is mounted read-only and served
  # byte-for-byte at /medias/<name>.
  staff:
    <<: *locked-app
    build: ./challenges/01-web-staff
    environment:
      FLAG: "${FLAG_01_STAFF}"
      HANDOUT_DIR: /handouts
      # Shown on the staff portal so solving 01 reveals the share login.
      # SAME values as the share service below (one source feeds both).
      SHARE_USER: "${SHARE_USER:-equipe-it}"
      SHARE_PASSWORD: "${SHARE_PASSWORD:-transition2026}"
    volumes:
      - ./handouts/dist:/handouts:ro          # built by ./scripts/build-handouts.sh
    ports: ["${BIND_ADDR:-}${BIND_ADDR:+:}8001:5000"]
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
          pids: 128
    restart: unless-stopped

  # ---- Internal file share (Intranet DécaFlop) ------------------------------
  # http://<PiIP>:8020 — DécaFlop's internal document share. Not a challenge:
  # the crew logs in and browses folders to find the evidence files, served
  # byte-for-byte from the same handouts/dist. The cellule de crise hands out
  # the login (see the Contexte sheet).
  share:
    <<: *locked-app
    build: ./share
    environment:
      SHARE_USER: "${SHARE_USER:-equipe-it}"
      SHARE_PASSWORD: "${SHARE_PASSWORD:-transition2026}"
    volumes:
      - ./handouts/dist:/handouts:ro          # built by ./scripts/build-handouts.sh
    ports: ["${BIND_ADDR:-}${BIND_ADDR:+:}8020:5000"]
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
          pids: 128
    restart: unless-stopped

  # ---- 04 · Web · medium (IDOR) -----------------------------------------
  idor:
    <<: *locked-app
    build: ./challenges/04-web-idor
    environment:
      FLAG: "${FLAG_04_IDOR}"
    ports: ["${BIND_ADDR:-}${BIND_ADDR:+:}8004:5000"]
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
          pids: 128
    restart: unless-stopped

  # ---- 06 · Web · medium (SQLi auth bypass) -----------------------------
  sqli:
    <<: *locked-app
    build: ./challenges/06-web-sqli
    environment:
      FLAG: "${FLAG_06_SQLI}"
    ports: ["${BIND_ADDR:-}${BIND_ADDR:+:}8006:5000"]
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
          pids: 128
    restart: unless-stopped

  # ---- 10 · Web · hard (JWT weak secret) --------------------------------
  # JWT_SECRET is the HS256 signing secret players crack. The SAME value is
  # leaked in 11's git history (see gitleak below), so dumping that repo is an
  # alternate route into this challenge. Both default to 10's own default.
  jwt:
    <<: *locked-app
    build: ./challenges/10-web-jwt
    environment:
      FLAG: "${FLAG_10_JWT}"
      JWT_SECRET: "${JWT_SECRET:-DecaFlop2026}"
    ports: ["${BIND_ADDR:-}${BIND_ADDR:+:}8010:5000"]
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
          pids: 128
    restart: unless-stopped

  # ---- 11 · Web · hard (exposed .git) -----------------------------------
  # API_JWT_SECRET must match 10's JWT_SECRET: the entrypoint writes it into the
  # first commit's config, so the git leak also exposes 10's signing secret.
  gitleak:
    <<: *locked-app
    build: ./challenges/11-web-gitleak
    environment:
      FLAG: "${FLAG_11_GIT}"
      API_JWT_SECRET: "${JWT_SECRET:-DecaFlop2026}"
      # read-only image: the entrypoint builds the leaky repo under /tmp
      SITE_DIR: /tmp/site
      HOME: /tmp
    ports: ["${BIND_ADDR:-}${BIND_ADDR:+:}8011:5000"]
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
          pids: 128
    restart: unless-stopped

  # ---- 12 · Web · hard (SSTI) -------------------------------------------
  # Code execution inside a shared app: each certificate renders in a
  # throwaway child process (see app.py), so a payload's changes never reach
  # the next player; the locked-app settings above stop file changes.
  ssti:
    <<: *locked-app
    build: ./challenges/12-web-ssti
    environment:
      FLAG: "${FLAG_12_SSTI}"
    ports: ["${BIND_ADDR:-}${BIND_ADDR:+:}8012:5000"]
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
          pids: 128
    restart: unless-stopped

  # ---- 14 · SAP · medium (gateway reginfo, simulated) -------------------
  sapgw:
    <<: *locked-app
    build: ./challenges/14-sap-gateway
    environment:
      FLAG_14: "${FLAG_14_SAP_GW}"
    ports: ["${BIND_ADDR:-}${BIND_ADDR:+:}8014:5000"]
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
          pids: 128
    restart: unless-stopped

  # ---- Finale · War Room (final incident report) ------------------------
  # http://<PiIP>:8099 — players pool the findings of every track into one
  # report; only a fully correct one reveals the Grandmaster Flag.
  # It gets ONLY its own flag and the rogue-device answer from .env (never the
  # whole file: no other mission's flag may sit in this container). It listens
  # on 8099 itself (gunicorn, one worker: the rate-limit counters are in memory).
  # An unset ROGUE_* is passed as "" and the app then uses its built-in default.
  warroom:
    <<: *locked-app
    build: ./warroom
    environment:
      FLAG_FINALE: "${FLAG_FINALE}"
      ROGUE_MAC: "${ROGUE_MAC:-}"
      ROGUE_IP: "${ROGUE_IP:-}"
    ports: ["${BIND_ADDR:-}${BIND_ADDR:+:}8099:8099"]
    deploy:                 # (not mem_limit: the online overlay merges a pids/cpu cap here)
      resources:
        limits:
          memory: 64M
          cpus: '0.5'
          pids: 128
    restart: unless-stopped

  # ---- Scoreboard: CTFd (teams, flags, hints, scores) --------------------
  # http://<PiIP>:8000 — finish the setup wizard once, then load the
  # challenges with: python3 scripts/ctfd-setup.py --host <PiIP>
  ctfd:
    image: ctfd/ctfd:3.8.8
    environment:
      SECRET_KEY: "${CTFD_SECRET_KEY}"          # from .env (gen-flags.sh)
      DATABASE_URL: "sqlite:////var/uploads/ctfd.db"
      UPLOAD_FOLDER: /var/uploads
      WORKERS: "1"
    volumes:
      - ctfd-data:/var/uploads                   # database + uploads; `down -v` wipes it
    ports: ["${BIND_ADDR:-}${BIND_ADDR:+:}8000:8000"]
    mem_limit: 768m
    restart: unless-stopped

  # ---- Browser toolbox for locked-down (corporate) laptops --------------
  # Players install nothing: a browser reaches both of these on the Pi.
  # http://<PiIP>:8090 — CyberChef (static, 100% client-side: base64, EXIF,
  #   unzip, file carving, MD5, JWT). Stateless, one shared instance is fine.
  #   Needs tools/cyberchef/cyberchef.zip at build time (see its README).
  cyberchef:
    build: ./tools/cyberchef
    ports: ["${BIND_ADDR:-}${BIND_ADDR:+:}8090:80"]
    mem_limit: 96m
    restart: unless-stopped

  # http://<PiIP>:8091 — ttyd web terminal with git-dumper, john, binwalk,
  #   foremost, exiftool, curl, python3. The catch-all (really only 11 needs a
  #   shell). NO repo/flags/source mounted. Each player logs in with a pseudo
  #   + password (created on first use) and gets their own Unix user, private
  #   home and tmux session (see tools/toolbox/shell.sh): close the tab or
  #   lose the Wi-Fi, log in again, everything is still there. Players cannot
  #   read each other's files, kill each other's processes or plant commands
  #   in each other's shell. Homes live on the toolbox-data volume (kept
  #   across restarts, wiped by `down -v` like CTFd's), with per-player
  #   process / file / quota caps enforced by a watchdog. Players only see
  #   their own processes (hidepid, set by toolbox-init at start).
  #   ttyd runs as root only to switch to the player's user (and hang up its
  #   tmux client): every capability except SETUID/SETGID/CHOWN/KILL is
  #   dropped, the image is read-only, the players' shells get no capability.
  #   -O refuses WebSockets from another origin, -m caps open terminals.
  #   Organizer: docker compose exec toolbox toolbox-admin liste|mdp|supprimer
  toolbox:
    build: ./tools/toolbox
    command: ["ttyd", "-p", "7681", "-W", "-O", "-m", "20", "/usr/local/bin/player-shell"]
    ports: ["${BIND_ADDR:-}${BIND_ADDR:+:}8091:7681"]
    # 1.5 GB: one hashcat run needs ~0.7 GB the first time (it compiles its
    # CPU kernels), ~0.45 GB after; two players cracking at once must fit.
    # A run that still overflows is OOM-killed alone (largest process), never
    # another player's shell. pids: 64 per player (in shell.sh) x a few.
    mem_limit: 1536m
    cpus: 2.0
    pids_limit: 1024
    init: true
    cap_drop: [ALL]
    # SYS_ADMIN + SETPCAP: only for toolbox-init, the entrypoint, which
    # remounts /proc with hidepid (players cannot see each other's processes
    # or command lines) and then removes both from the bounding set before
    # starting ttyd: no player shell can ever use them. Docker's AppArmor
    # profile stays on; where it forbids the remount, the hiding is skipped
    # (see the toolbox logs / `toolbox-admin liste`).
    cap_add: [SETUID, SETGID, CHOWN, KILL, SYS_ADMIN, SETPCAP]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    volumes:
      - toolbox-data:/work                    # players' homes + accounts; `down -v` wipes it
    tmpfs:
      - "/run/toolbox:size=1m,mode=0700"
      - "/tmp:size=64m,mode=1733"             # writable, not listable: no peeking at others' temp files
    restart: unless-stopped

volumes:
  ctfd-data:
  hub-data:
  toolbox-data:
