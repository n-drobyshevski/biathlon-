# ============================================================================
#  DÉCAFLOP CTF — OPTIONAL online overlay: Cloudflare Tunnel + Cloudflare Access
# ----------------------------------------------------------------------------
#  NOT used by a plain `docker compose up -d` (offline Pi mode is unchanged).
#  Online, run BOTH files:
#    docker compose -f docker-compose.yml -f docker-compose.cloudflare.yml up -d
#  and do the dashboard side first (tunnel, public hostnames, Access policy):
#  see CLOUDFLARE.md. Never publish a hostname without an Access policy.
#
#  Containment model (assume a challenge container WILL be popped, 12 = SSTI):
#  - every service sits ONLY on `internal: true` networks: no route to the
#    internet, no route to the LAN.
#  - segmented: the challenges, the share and the toolbox share `internal`
#    (the terminal must reach them by name); CTFd (`scoreboard`), the hub
#    (`front`) and CyberChef (`chef`) each have their own network. A shell in a
#    challenge cannot even resolve `ctfd`: its login/API stay behind Access.
#  - only `cloudflared` joins every network plus `edge` (normal bridge, egress)
#    to dial the OUTBOUND tunnel. Nothing listens on the host's public interface.
#  - Docker does not publish ports for containers that are only on internal
#    networks; the port lists below are pinned to 127.0.0.1 anyway as a
#    fail-safe (they never fall back to 0.0.0.0 even if .env lacks BIND_ADDR).
#  - no repo / .env / flags / docker socket mounted; each challenge only gets
#    its own FLAG env (as offline). Non-root, all capabilities dropped,
#    no-new-privileges, read-only root filesystem (scratch on a small tmpfs,
#    wiped on restart) and pids/cpu caps wherever the image allows.
#  - third-party images pinned by tag AND digest. To bump one:
#      docker buildx imagetools inspect cloudflare/cloudflared:<new tag>
#    and copy the top-level "Digest:" (multi-arch index, includes arm64).
#
#  Needs in .env (never commit it): TUNNEL_TOKEN, CTF_DOMAIN (+ BIND_ADDR=127.0.0.1).
# ============================================================================

# Inside the internal network every service answers on its compose name AND,
# where they differ, on its public subdomain label (staff = site, gitleak =
# git), so the toolbox banner can say "same name as the subdomain".
#
# The Flask apps' hardening (nobody, no capabilities, no-new-privileges,
# read-only image, /tmp tmpfs, init, pids/cpu caps) is in the base file's
# x-locked-app, so it applies offline too; online only adds the network.
x-locked-app: &locked-app
  networks: [internal]

services:
  # ---- The only container with internet access: the outbound tunnel ------
  cloudflared:
    image: cloudflare/cloudflared:2026.10.1@sha256:a15a3b50b8dabd57ac2090e9484c0247dba9dfa1f0df4d298d4317f9d69eb2d5
    # --metrics on loopback: in a container cloudflared otherwise listens on
    # 0.0.0.0:20241, and it shares `internal` with the challenges. That port
    # serves /metrics, /config (every hostname + origin) and /debug/pprof (heap
    # dumps of the process that holds the tunnel token): verified reachable
    # from a popped challenge without this flag.
    command: tunnel --no-autoupdate --metrics 127.0.0.1:20241 run
    environment:
      TUNNEL_TOKEN: "${TUNNEL_TOKEN:?set TUNNEL_TOKEN in .env (see CLOUDFLARE.md)}"
    networks: [internal, scoreboard, front, chef, edge]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    pids_limit: 128
    mem_limit: 128m
    restart: unless-stopped

  # ---- Hub: links point at the public subdomains --------------------------
  hub:
    <<: *locked-app
    networks: [front]
    environment:
      SITE_URL: "https://site.${CTF_DOMAIN:?set CTF_DOMAIN in .env (see CLOUDFLARE.md)}/"
      IDOR_URL: "https://idor.${CTF_DOMAIN}/"
      SQLI_URL: "https://sqli.${CTF_DOMAIN}/"
      JWT_URL: "https://jwt.${CTF_DOMAIN}/"
      GIT_URL: "https://git.${CTF_DOMAIN}/"
      SSTI_URL: "https://ssti.${CTF_DOMAIN}/"
      SAPGW_URL: "https://sapgw.${CTF_DOMAIN}/"
      SHARE_URL: "https://share.${CTF_DOMAIN}/"
      SCOREBOARD_URL: "https://ctfd.${CTF_DOMAIN}/"
      CYBERCHEF_URL: "https://cyberchef.${CTF_DOMAIN}/"
      TERMINAL_URL: "https://terminal.${CTF_DOMAIN}/"
      # the hub's network cannot reach CTFd online: it keeps its own pseudos
      CTFD_INTERNAL_URL: ""
      # host:port links are meaningless online: the *_URL values above win
      CTFD_PORT: ""
      CYBERCHEF_PORT: ""
      TERMINAL_PORT: ""
    ports: !override ["127.0.0.1:8080:5000"]

  staff:
    <<: *locked-app
    networks:
      internal:
        aliases: [site]   # same name as its subdomain, for the toolbox
    ports: !override ["127.0.0.1:8001:5000"]

  share:
    <<: *locked-app
    ports: !override ["127.0.0.1:8020:5000"]

  idor:
    <<: *locked-app
    ports: !override ["127.0.0.1:8004:5000"]

  sqli:
    <<: *locked-app
    ports: !override ["127.0.0.1:8006:5000"]

  jwt:
    <<: *locked-app
    ports: !override ["127.0.0.1:8010:5000"]

  gitleak:
    <<: *locked-app
    networks:
      internal:
        aliases: [git]    # same name as its subdomain, for the toolbox
    ports: !override ["127.0.0.1:8011:5000"]

  ssti:
    <<: *locked-app
    ports: !override ["127.0.0.1:8012:5000"]

  sapgw:
    <<: *locked-app
    ports: !override ["127.0.0.1:8014:5000"]

  # CTFd image already runs as its own non-root user. REVERSE_PROXY makes it
  # trust cloudflared's X-Forwarded-Proto/Host, so it builds its own public
  # https://ctfd.<domain> URLs (CTFd has no separate "site URL" setting).
  # Its own network: no challenge container can reach it, only the tunnel.
  ctfd:
    image: ctfd/ctfd:3.8.8@sha256:07cc9788d58b2a18ea4dc2103ff385c053ffc506f57d0c769a99387849aedd01
    networks: [scoreboard]
    environment:
      REVERSE_PROXY: "true"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs:                # state lives in the ctfd-data volume; these are scratch/cache
      - "/tmp:size=64m,mode=1777"
      - "/var/log/CTFd:size=32m,uid=1001,gid=1001,mode=0755"
      - "/opt/CTFd/.data:size=64m,uid=1001,gid=1001,mode=0755"     # filesystem cache
    pids_limit: 256
    ports: !override ["127.0.0.1:8000:8000"]

  # nginx (alpine) starts as root to bind :80 and drop to the nginx user: keep
  # only the capabilities that needs. Static files only, so read-only is fine.
  cyberchef:
    networks: [chef]
    cap_drop: [ALL]
    cap_add: [CHOWN, SETUID, SETGID, NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs: ["/var/cache/nginx:size=16m", "/var/run:size=1m", "/tmp:size=16m"]
    pids_limit: 64
    ports: !override ["127.0.0.1:8090:80"]

  # Per-tab users, capabilities, read-only image, tmpfs scratch space, the
  # origin check (-O) and the terminal cap (-m) all come from the base file.
  # Online it has NO internet either: players reach services by internal name
  # (see its banner). -O matters most here: a script planted on another lab
  # subdomain cannot open a shell with a player's Access cookie.
  toolbox:
    networks: [internal]
    ports: !override ["127.0.0.1:8091:7681"]

networks:
  internal:
    internal: true        # challenges + share + toolbox: no egress
  scoreboard:
    internal: true        # CTFd + cloudflared only
  front:
    internal: true        # hub + cloudflared only
  chef:
    internal: true        # CyberChef + cloudflared only
  edge:                   # normal bridge, used by cloudflared only
    driver_opts:          # fixed interface name for scripts/cloudflare-egress.sh
      com.docker.network.bridge.name: ctf-edge
